services:
  # --- Gateway ---
  gateway-api:
    profiles: ["app"]
    build:
      context: ./gateway-api
      dockerfile: Dockerfile
    container_name: gateway-api
    env_file: ./gateway-api/.env
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:8080" 
    networks:
      - elearning-net
    depends_on:
      - ms-auth
      - ms-usuarios
      - ms-cursos

  # --- MS Auth ---
  ms-auth:
    profiles: ["app"]
    build:
      context: ./ms-auth
      dockerfile: Dockerfile
    container_name: ms-auth
    env_file: ./ms-auth/.env
    ports:
      - "${MS_AUTH_HTTP_PORT:-8082}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: mongodb://mongo-auth:27017/${MONGO_DB}
    depends_on:
      mongo-auth:
        condition: service_healthy
    networks:
      - elearning-net

  mongo-auth:
    image: mongo:7
    container_name: mongo-auth
    volumes:
      - ms-auth_mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - elearning-net

  # --- MS Usuários ---
  ms-usuarios:
    profiles: ["app"]
    build:
      context: ./ms-usuarios
      dockerfile: Dockerfile
    container_name: ms-usuarios
    env_file: ./ms-usuarios/.env
    ports:
      - "${MS_USUARIOS_HTTP_PORT:-8101}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-usuarios:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db-usuarios:
        condition: service_healthy
    networks:
      - elearning-net

  db-usuarios:
    image: postgres:15
    container_name: db-usuarios
    env_file: ./ms-usuarios/.env
    volumes:
      - ms-usuarios_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - elearning-net

  # --- MS Cursos ---
  ms-cursos:
    profiles: ["app"]
    build:
      context: ./ms-cursos
      dockerfile: Dockerfile
    container_name: ms-cursos
    env_file: ./ms-cursos/.env
    ports:
      - "${MS_CURSOS_HTTP_PORT:-8102}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-cursos:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db-cursos:
        condition: service_healthy
    networks:
      - elearning-net

  db-cursos:
    image: postgres:15
    container_name: db-cursos
    env_file: ./ms-cursos/.env
    volumes:
      - ms-cursos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - elearning-net

