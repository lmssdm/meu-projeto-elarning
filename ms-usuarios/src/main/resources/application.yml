server:
  port: 8080 # Porta interna do contêiner

spring:
  application:
    name: ms-usuarios # Nome do microsserviço

  datasource:
    # Aponta para o serviço 'db-usuarios' no docker-compose.yml
    url: jdbc:postgresql://db-usuarios:5432/elarning_usuarios_db 
    username: ${POSTGRES_USER}   # (Vem do docker-compose)
    password: ${POSTGRES_PASSWORD} # (Vem do docker-compose)
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'update' cria/altera as tabelas automaticamente.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect